<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheat Type Filter & Distribution</title>
  <style>
    body {
      background-color: #0c0a12;
      color: #e2e8f0;
      font-family: monospace, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .distribution-card {
      background: #13111c;
      border: 1px solid #282438;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      color: #94a3b8;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .badges-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background: #1a1726;
      border: 1px solid #3b3554;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .badge:hover {
      border-color: #a855f7;
      background: #252038;
    }

    .badge.active {
      background: #a855f7;
      color: #fff;
      border-color: #c084fc;
    }

    .badge-count {
      color: #c084fc;
      margin-left: 6px;
      font-weight: bold;
    }

    .badge.active .badge-count {
      color: #fff;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-input, .select-input {
      background: #13111c;
      border: 1px solid #282438;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
    }

    .search-input {
      flex: 1;
    }

    .select-input {
      min-width: 180px;
    }

    .status-counter {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .case-item {
      background: #13111c;
      border: 1px solid #282438;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="distribution-card">
    <div class="card-title">CHEAT TYPE DISTRIBUTION</div>
    <div id="badgesContainer" class="badges-wrapper"></div>
  </div>

  <div class="controls-row">
    <input type="text" id="searchInput" class="search-input" placeholder="Search by name or ID...">
    
    <select id="cheatTypeSelect" class="select-input">
      <option value="ALL">All Cheat Types</option>
    </select>
  </div>

  <div id="statusCounter" class="status-counter"></div>
  <div id="resultsList" class="results-list" style="margin-top: 12px;"></div>

</div>

<script>
  const mockCases = [
    { case_id: "CASE-001", ign: "xvh", cheat_type: "Aimbot" },
    { case_id: "CASE-002", ign: "zxcvbn", cheat_type: "Aimbot" },
    { case_id: "CASE-003", ign: "waller99", cheat_type: "ESP / Wallhack" },
    { case_id: "CASE-004", ign: "fastboi", cheat_type: "Speedhack" },
    { case_id: "CASE-005", ign: "bhopgod", cheat_type: "Auto-Bhop" },
    { case_id: "CASE-006", ign: "laggy", cheat_type: "Lerp / Interp" },
    { case_id: "CASE-007", ign: "streamboy", cheat_type: "Cheat on Stream" }
  ];

  let activeFilter = "ALL";
  let searchQuery = "";

  const badgesContainer = document.getElementById("badgesContainer");
  const cheatTypeSelect = document.getElementById("cheatTypeSelect");
  const searchInput = document.getElementById("searchInput");
  const resultsList = document.getElementById("resultsList");
  const statusCounter = document.getElementById("statusCounter");

  function init() {
    const counts = calculateCounts(mockCases);
    renderBadgesAndOptions(counts);
    
    cheatTypeSelect.addEventListener("change", (e) => {
      activeFilter = e.target.value;
      updateUI();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderResults();
    });

    updateUI();
  }

  function calculateCounts(data) {
    return data.reduce((acc, item) => {
      acc[item.cheat_type] = (acc[item.cheat_type] || 0) + 1;
      return acc;
    }, {});
  }

  function renderBadgesAndOptions(counts) {
    const sortedTypes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

    badgesContainer.innerHTML = "";
    
    const allBadge = createBadge("All Types", mockCases.length, "ALL");
    badgesContainer.appendChild(allBadge);

    sortedTypes.forEach(type => {
      const badge = createBadge(type, counts[type], type);
      badgesContainer.appendChild(badge);

      const option = document.createElement("option");
      option.value = type;
      option.textContent = `${type} (${counts[type]})`;
      cheatTypeSelect.appendChild(option);
    });
  }

  function createBadge(label, count, value) {
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.dataset.value = value;
    badge.innerHTML = `${label} <span class="badge-count">${count}</span>`;
    
    badge.addEventListener("click", () => {
      activeFilter = value;
      cheatTypeSelect.value = value;
      updateUI();
    });

    return badge;
  }

  function updateUI() {
    document.querySelectorAll(".badge").forEach(badge => {
      if (badge.dataset.value === activeFilter) {
        badge.classList.add("active");
      } else {
        badge.classList.remove("active");
      }
    });

    renderResults();
  }

  function renderResults() {
    const filtered = mockCases.filter(item => {
      const matchesType = activeFilter === "ALL" || item.cheat_type === activeFilter;
      const matchesSearch = item.ign.toLowerCase().includes(searchQuery) || 
                            item.case_id.toLowerCase().includes(searchQuery);
      return matchesType && matchesSearch;
    });

    statusCounter.textContent = `Showing ${filtered.length} of ${mockCases.length} total cases`;

    resultsList.innerHTML = filtered.map(item => `
      <div class="case-item">
        <span><strong>${item.case_id}</strong> - ${item.ign}</span>
        <span style="color: #a855f7;">${item.cheat_type}</span>
      </div>
    `).join('');
  }

  init();
</script>

</body>
</html>
